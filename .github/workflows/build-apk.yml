name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        type: string
      package_name:
        description: 'Package Name'
        required: true
        type: string
      website_url:
        description: 'Website URL'
        required: true
        type: string
      version_code:
        description: 'Version Code'
        required: true
        type: string
        default: '1'
      version_name:
        description: 'Version Name'
        required: true
        type: string
        default: '1.0.0'
      theme_color:
        description: 'Theme Color'
        required: false
        type: string
        default: '#4F46E5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
        accept-android-sdk-licenses: true
    
    - name: Create Android Project
      run: |
        echo "Creating project structure..."
        mkdir -p app/src/main/java/com/appforge/builder
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p gradle/wrapper
        
        # Root build.gradle - USE AGP 8.7.0 which works with Gradle 8.9+
        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.7.0' apply false
        }
        EOF
        
        # settings.gradle
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AppForgeApp"
        include ':app'
        EOF
        
        # Gradle wrapper - use 8.9 which is compatible with AGP 8.7
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # gradle.properties
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        android.defaults.buildfeatures.buildconfig=true
        EOF
        
        # App build.gradle
        cat > app/build.gradle << EOF
        plugins {
            id 'com.android.application'
        }

        android {
            namespace '${{ inputs.package_name }}'
            compileSdk 34

            defaultConfig {
                applicationId '${{ inputs.package_name }}'
                minSdk 21
                targetSdk 34
                versionCode ${{ inputs.version_code }}
                versionName '${{ inputs.version_name }}'
            }

            buildTypes {
                release {
                    minifyEnabled false
                    shrinkResources false
                }
                debug {
                    minifyEnabled false
                    debuggable true
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        }
        EOF
        
        # AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application 
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="${{ inputs.app_name }}" 
                android:supportsRtl="true"
                android:theme="@style/Theme.AppForge"
                android:usesCleartextTraffic="true">
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true" 
                    android:configChanges="orientation|screenSize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # MainActivity.java
        cat > app/src/main/java/com/appforge/builder/MainActivity.java << EOF
        package ${{ inputs.package_name }};

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private SwipeRefreshLayout swipeRefreshLayout;
            
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                webView = findViewById(R.id.webView);
                swipeRefreshLayout = findViewById(R.id.swipeRefresh);
                
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setUseWideViewPort(true);
                webSettings.setLoadWithOverviewMode(true);
                webSettings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                
                webView.setWebViewClient(new WebViewClient());
                
                swipeRefreshLayout.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener() {
                    @Override
                    public void onRefresh() {
                        webView.reload();
                    }
                });
                
                webView.loadUrl("${{ inputs.website_url }}");
            }
            
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF
        
        # Layout
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.swiperefreshlayout.widget.SwipeRefreshLayout 
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/swipeRefresh" 
            android:layout_width="match_parent" 
            android:layout_height="match_parent">
            <WebView 
                android:id="@+id/webView" 
                android:layout_width="match_parent" 
                android:layout_height="match_parent"/>
        </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
        EOF
        
        # Styles
        cat > app/src/main/res/values/styles.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AppForge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">${{ inputs.theme_color }}</item>
                <item name="colorPrimaryVariant">${{ inputs.theme_color }}</item>
                <item name="colorOnPrimary">@android:color/white</item>
            </style>
        </resources>
        EOF
        
        # Strings
        cat > app/src/main/res/values/strings.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">${{ inputs.app_name }}</string>
        </resources>
        EOF
        
        # Launcher icon colors
        cat > app/src/main/res/values/ic_launcher_colors.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="ic_launcher_background">${{ inputs.theme_color }}</color>
            <color name="ic_launcher_foreground">#FFFFFF</color>
        </resources>
        EOF
        
        echo "Project created successfully"
    
    - name: Build Debug APK
      run: |
        echo "Starting Gradle build with compatible versions..."
        gradle assembleDebug --no-daemon --stacktrace
    
    - name: Verify APK
      run: |
        echo "Looking for APK..."
        find . -name "*.apk" -type f -exec ls -la {} \;
        
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
            echo "APK found! Size: ${SIZE} bytes ($(echo "scale=2; ${SIZE}/1048576" | bc) MB)"
        else
            echo "APK NOT FOUND. Listing build output:"
            find app/build -type f 2>/dev/null || echo "No build output"
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
