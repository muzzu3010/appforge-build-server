name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        type: string
      package_name:
        description: 'Package Name'
        required: true
        type: string
      website_url:
        description: 'Website URL'
        required: true
        type: string
      version_code:
        description: 'Version Code'
        required: true
        type: string
        default: '1'
      version_name:
        description: 'Version Name'
        required: true
        type: string
        default: '1.0.0'
      theme_color:
        description: 'Theme Color'
        required: false
        type: string
        default: '#4F46E5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
        accept-android-sdk-licenses: true
    
    - name: Debug - Check Environment
      run: |
        echo "JAVA_HOME: $JAVA_HOME"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "PATH: $PATH"
        java -version
        gradle --version
        ls -la $ANDROID_HOME/
        ls -la $ANDROID_HOME/build-tools/
    
    - name: Create Android Project
      run: |
        echo "=== Step 1: Create directories ==="
        mkdir -p app/src/main/java/com/appforge/builder
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p gradle/wrapper
        
        echo "=== Step 2: Create root build.gradle ==="
        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        EOF
        echo "Root build.gradle created"
        cat build.gradle
        
        echo "=== Step 3: Create settings.gradle ==="
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AppForgeApp"
        include ':app'
        EOF
        
        echo "=== Step 4: Create gradle-wrapper.properties ==="
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        echo "=== Step 5: Create gradle.properties ==="
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF
        
        echo "=== Step 6: Create app/build.gradle ==="
        cat > app/build.gradle << EOF
        plugins {
            id 'com.android.application'
        }

        android {
            namespace '${{ inputs.package_name }}'
            compileSdk 34

            defaultConfig {
                applicationId '${{ inputs.package_name }}'
                minSdk 21
                targetSdk 34
                versionCode ${{ inputs.version_code }}
                versionName '${{ inputs.version_name }}'
            }

            buildTypes {
                release {
                    minifyEnabled false
                    shrinkResources false
                }
                debug {
                    minifyEnabled false
                    debuggable true
                }
            }
            
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.10.0'
            implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
        }
        EOF
        echo "app/build.gradle created"
        
        echo "=== Step 7: Create AndroidManifest.xml ==="
        cat > app/src/main/AndroidManifest.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application 
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="${{ inputs.app_name }}" 
                android:supportsRtl="true"
                android:theme="@style/Theme.AppForge"
                android:usesCleartextTraffic="true">
                <activity 
                    android:name=".MainActivity" 
                    android:exported="true" 
                    android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        echo "=== Step 8: Create MainActivity.java ==="
        cat > app/src/main/java/com/appforge/builder/MainActivity.java << EOF
        package ${{ inputs.package_name }};

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

        public class MainActivity extends AppCompatActivity {
            
            private WebView webView;
            private SwipeRefreshLayout swipeRefreshLayout;
            
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                
                webView = findViewById(R.id.webView);
                swipeRefreshLayout = findViewById(R.id.swipeRefresh);
                
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webSettings.setUseWideViewPort(true);
                webSettings.setLoadWithOverviewMode(true);
                
                webView.setWebViewClient(new WebViewClient());
                
                swipeRefreshLayout.setOnRefreshListener(new SwipeRefreshLayout.OnRefreshListener() {
                    @Override
                    public void onRefresh() {
                        webView.reload();
                    }
                });
                
                webView.loadUrl("${{ inputs.website_url }}");
            }
            
            @Override
            public void onBackPressed() {
                if (webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF
        
        echo "=== Step 9: Create layout ==="
        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <androidx.swiperefreshlayout.widget.SwipeRefreshLayout 
            xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/swipeRefresh" 
            android:layout_width="match_parent" 
            android:layout_height="match_parent">
            <WebView 
                android:id="@+id/webView" 
                android:layout_width="match_parent" 
                android:layout_height="match_parent"/>
        </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
        EOF
        
        echo "=== Step 10: Create styles.xml ==="
        cat > app/src/main/res/values/styles.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <style name="Theme.AppForge" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">${{ inputs.theme_color }}</item>
                <item name="colorPrimaryVariant">${{ inputs.theme_color }}</item>
                <item name="colorOnPrimary">@android:color/white</item>
            </style>
        </resources>
        EOF
        
        echo "=== Step 11: Create strings.xml ==="
        cat > app/src/main/res/values/strings.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">${{ inputs.app_name }}</string>
        </resources>
        EOF
        
        echo "=== Step 12: Create launcher icon ==="
        cat > app/src/main/res/mipmap-hdpi/ic_launcher.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@color/ic_launcher_foreground"/>
        </adaptive-icon>
        EOF
        
        cat > app/src/main/res/values/ic_launcher_colors.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="ic_launcher_background">#4F46E5</color>
            <color name="ic_launcher_foreground">#FFFFFF</color>
        </resources>
        EOF
        
        echo "=== Project structure ==="
        find . -type f | head -50
        echo "=== All files created ==="
    
    - name: Build Debug APK
      run: |
        echo "=== Starting Gradle Build ==="
        gradle assembleDebug --stacktrace 2>&1
        BUILD_EXIT=$?
        echo "=== Gradle exit code: $BUILD_EXIT ==="
        
        if [ $BUILD_EXIT -eq 0 ]; then
            echo "=== Build SUCCESS ==="
        else
            echo "=== Build FAILED ==="
            echo "=== Checking for any APK files ==="
            find . -name "*.apk" -type f 2>/dev/null
            echo "=== Listing build directories ==="
            find app/build -type f 2>/dev/null | head -20
        fi
        
        exit $BUILD_EXIT
    
    - name: Verify APK
      run: |
        echo "=== Looking for APK files ==="
        find . -name "*.apk" -type f
        
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "=== Debug APK found ==="
            ls -la app/build/outputs/apk/debug/app-debug.apk
            echo "APK size: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk) bytes"
        else
            echo "=== Debug APK NOT FOUND ==="
            echo "Listing all files in app/build:"
            find app/build -type f 2>/dev/null
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
